<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1b3a"/>
      <stop offset="1" stop-color="#0b0a18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#5b4bff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5b4bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb36b"/>
      <stop offset="1" stop-color="#ff5e8a"/>
    </linearGradient>
    <linearGradient id="cool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fe3ff"/>
      <stop offset="1" stop-color="#7b6bff"/>
    </linearGradient>
    <clipPath id="left"><rect x="0" y="0" width="512" height="1024"/></clipPath>
    <clipPath id="right"><rect x="512" y="0" width="512" height="1024"/></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- macOS squircle tile -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>

  <!-- swap arrows around the face -->
  <g fill="none" stroke-width="26" stroke-linecap="round">
    <path d="M 268 330 A 290 290 0 0 1 700 250" stroke="url(#warm)"/>
    <path d="M 756 694 A 290 290 0 0 1 324 774" stroke="url(#cool)"/>
  </g>
  <path d="M 676 206 L 760 262 L 668 300 Z" fill="#ffb36b" stroke="#ffb36b" stroke-width="10" stroke-linejoin="round"/>
  <path d="M 348 818 L 264 762 L 356 724 Z" fill="#7b6bff" stroke="#7b6bff" stroke-width="10" stroke-linejoin="round"/>

  <!-- left half: solid face -->
  <g clip-path="url(#left)">
    <ellipse cx="512" cy="520" rx="175" ry="225" fill="url(#warm)"/>
    <path d="M 405 455 Q 440 432 478 452" stroke="#2a1630" stroke-width="14" fill="none" stroke-linecap="round"/>
    <ellipse cx="442" cy="492" rx="20" ry="13" fill="#2a1630"/>
    <path d="M 506 520 Q 492 575 512 588" stroke="#2a1630" stroke-opacity="0.55" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M 440 640 Q 476 662 512 662" stroke="#2a1630" stroke-width="13" fill="none" stroke-linecap="round"/>
  </g>

  <!-- right half: AI wireframe with the 5 landmarks -->
  <g clip-path="url(#right)">
    <ellipse cx="512" cy="520" rx="175" ry="225" fill="#4fe3ff" fill-opacity="0.07"/>
    <ellipse cx="512" cy="520" rx="175" ry="225" fill="none" stroke="url(#cool)" stroke-width="10"/>
    <g stroke="url(#cool)" stroke-width="5" stroke-opacity="0.7" fill="none">
      <path d="M 512 300 Q 610 400 600 520 Q 594 640 512 742"/>
      <path d="M 512 410 Q 600 400 674 430"/>
      <path d="M 512 700 Q 580 690 640 660"/>
      <!-- landmark mesh -->
      <polyline points="582,492 512,585 584,650 512,662"/>
      <line x1="582" y1="492" x2="584" y2="650"/>
    </g>
    <g fill="#bff6ff" filter="url(#soft)" opacity="0.9">
      <circle cx="582" cy="492" r="18"/><circle cx="512" cy="585" r="18"/><circle cx="584" cy="650" r="18"/>
    </g>
    <g fill="#ffffff">
      <circle cx="582" cy="492" r="11"/><circle cx="512" cy="585" r="11"/><circle cx="584" cy="650" r="11"/>
    </g>
  </g>

  <!-- seam -->
  <line x1="512" y1="282" x2="512" y2="758" stroke="#ffffff" stroke-opacity="0.85" stroke-width="4" stroke-dasharray="10 12"/>
</svg>
