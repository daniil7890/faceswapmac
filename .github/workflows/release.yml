name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: bash scripts/make_app.sh
      - name: Zip
        run: cd build && ditto -c -k --keepParent FaceSwap.app FaceSwap-${{ github.ref_name }}-arm64.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "build/FaceSwap-${{ github.ref_name }}-arm64.zip" \
            --title "FaceSwapMac ${{ github.ref_name }}" --notes-file .github/RELEASE_NOTES.md
