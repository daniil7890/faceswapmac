name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза (тег), например v0.1.0"
        required: true
        default: "v0.2.0"
permissions:
  contents: write
env:
  VER: ${{ inputs.version || github.ref_name }}
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: bash scripts/make_app.sh
      - name: Zip
        run: cd build && ditto -c -k --keepParent FaceSwap.app FaceSwap-${{ env.VER }}-arm64.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ env.VER }}" "build/FaceSwap-${{ env.VER }}-arm64.zip" \
            --title "FaceSwapMac ${{ env.VER }}" --notes-file .github/RELEASE_NOTES.md --latest --target "${{ github.sha }}"
